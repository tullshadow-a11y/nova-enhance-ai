name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build Gradle Project
      run: |
        # البحث عن ملف gradlew وتحديد مساره
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Gradle wrapper not found, using system gradle"
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nova-enhance-ai-apk
        path: "**/build/outputs/apk/debug/*.apk"
